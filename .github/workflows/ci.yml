# ─────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml — GitHub Actions CI/CD Pipeline
#
# WHAT THIS FILE DOES:
#   Automatically runs on every git push to main or pull request.
#   Pipeline steps:
#     1. Checkout code
#     2. Set up Python 3.11
#     3. Install dependencies
#     4. Run pytest test suite
#     5. Build Docker image (verifies Dockerfile is valid)
#
# WHY CI/CD? (interview answer):
#   "CI/CD means every code change is automatically tested before
#    it reaches production. If I break the ingestion pipeline at
#    2am, GitHub Actions catches it immediately and emails me —
#    I don't find out from a user at 9am. It enforces a quality
#    gate: code that doesn't pass tests cannot be merged to main."
#
# HOW TO VIEW RESULTS:
#   Go to your GitHub repo → Actions tab → see each run
#   Green checkmark = tests passed
#   Red X = something broke, click to see which test failed
#
# SECRETS:
#   The OPENAI_API_KEY is stored as a GitHub Secret (never in code).
#   Go to repo Settings → Secrets → Actions → New repository secret
# ─────────────────────────────────────────────────────────────────

name: RAG Pipeline CI

# ── TRIGGERS ──────────────────────────────────────────────────────
# When does this pipeline run?
on:
  # On every push to the main branch
  push:
    branches: [ main ]

  # On every pull request targeting main
  # This means code is tested BEFORE it's merged
  pull_request:
    branches: [ main ]

  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:


# ── JOBS ──────────────────────────────────────────────────────────
jobs:

  # ── JOB 1: RUN TESTS ────────────────────────────────────────────
  test:
    name: Run Test Suite
    # Use the latest Ubuntu runner (GitHub-hosted, free for public repos)
    runs-on: ubuntu-latest

    # Start a Redis service container alongside the test runner
    # Our cache tests can connect to this real Redis instance
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Check out the repository code
      # Without this, the runner has no files to work with
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11
      # This installs Python and adds it to PATH
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          # Cache pip downloads between runs
          # WHY CACHE?
          # "Caching pip packages reduces CI run time from 3-4 minutes
          #  to under 1 minute by reusing downloaded packages instead
          #  of downloading them from PyPI every time."
          cache: 'pip'

      # Step 3: Install all dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the test suite
      # -v: verbose output (shows each test name and result)
      # --tb=short: short traceback for failures (easier to read)
      # -x: stop on first failure (fail fast — no point running more tests)
      # --cov: generate coverage report (what % of code is tested)
      - name: Run tests
        env:
          # Pass environment variables to the test runner
          # OPENAI_API_KEY is stored as a GitHub Secret
          # (never put real keys in this file)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ANONYMIZED_TELEMETRY: "False"
        run: |
          pytest tests/ -v --tb=short -x

      # Step 5: Upload test results as an artifact
      # Even if tests fail, you can download the results file
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()  # run even if previous steps failed
        with:
          name: test-results
          path: |
            .pytest_cache/
          retention-days: 7


  # ── JOB 2: BUILD DOCKER IMAGE ─────────────────────────────────
  # Only runs if the test job passes
  # This verifies the Dockerfile is valid and builds successfully
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test  # only run if 'test' job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx (enhanced build capabilities)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image
      # We don't push it anywhere (no registry credentials needed)
      # This just verifies the Dockerfile is valid
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # push: false means build but don't push to a registry
          # Change to true and add registry credentials to deploy automatically
          push: false
          tags: rag-pipeline:latest
          # Cache Docker layers between builds for speed
          cache-from: type=gha
          cache-to: type=gha,mode=max